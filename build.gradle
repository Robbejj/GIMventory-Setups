plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.gimventorysetups.GIMventorySetupsPluginTest'

// GIMventorySetupsDevHarness is local dev-only tooling that runs this plugin against a sibling
// checkout of inventory-setups while it isn't on the Plugin Hub. Only wire it up when that sibling
// has actually been built, so a fresh clone (contributors, CI, reviewers) can still run
// `./gradlew build`/`test` without it.
def inventorySetupsMainClasses = file('../inventory-setups/build/classes/java/main')
def inventorySetupsResources = file('../inventory-setups/build/resources/main')
def hasSiblingInventorySetups = inventorySetupsMainClasses.exists()

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion

	if (hasSiblingInventorySetups) {
		testCompileOnly files(inventorySetupsMainClasses)
		testRuntimeOnly files(inventorySetupsMainClasses, inventorySetupsResources)
	}
}

// Only compiles against the sibling inventory-setups classes added above - exclude it when that
// checkout isn't present so the test source set still builds cleanly on its own.
sourceSets {
	test {
		if (!hasSiblingInventorySetups) {
			java {
				exclude 'com/gimventorysetups/GIMventorySetupsDevHarness.java'
			}
		}
	}
}

group = 'com.gimventorysetups'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
